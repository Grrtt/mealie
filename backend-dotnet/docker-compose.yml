# Mealie C# Backend — Local Docker Compose
#
# Default stack:
#   SQL Server backend + Mailpit
#
# Usage:
#   SQL Server (default):
#     docker compose up
#   SQLite override:
#     MEALIE_DB_ENGINE=sqlite \
#     MEALIE_DATABASE_URL="Data Source=/app/data/mealie.db" \
#     docker compose up

services:

  # ── C# Backend (SQL Server, default) ────────────────────────────────────────
  mealie-api:
    container_name: mealie_api
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - mealie-data:/app/data
    environment:
      DB_ENGINE: "${MEALIE_DB_ENGINE:-sqlserver}"
      DATABASE_URL: "${MEALIE_DATABASE_URL:-Server=sqlserver,1433;Database=mealie;User Id=sa;Password=MealieSqlServerDev123!;TrustServerCertificate=True;Encrypt=False}"
      SECRET: "local-dev-secret-change-me-32chars!!"
      BASE_URL: "http://localhost:9000"
      DATA_DIR: /app/data
      LOG_LEVEL: Debug
      ALLOW_SIGNUP: "true"
      # Email — point at Mailpit
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH_STRATEGY: NONE
      SMTP_FROM_EMAIL: "noreply@mealie.local"
      SMTP_FROM_NAME: "Mealie (local)"
    depends_on:
      sqlserver:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    profiles: ["", "sqlserver", "postgres", "sqlite"]

  # ── SQL Server ───────────────────────────────────────────────────────────────
  sqlserver:
    container_name: mealie_sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "MealieSqlServerDev123!"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: ["", "sqlserver"]

  # ── Mailpit (email testing UI) ───────────────────────────────────────────────
  mailpit:
    container_name: mealie_mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI  → http://localhost:8025
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  mealie-data:
    driver: local
  sqlserver-data:
    driver: local
