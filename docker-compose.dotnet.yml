# Mealie — Full Stack (C# backend + Nuxt frontend)
#
# Profiles:
#   (default)  SQLite + Mailpit
#   postgres   PostgreSQL + Mailpit
#
# Usage:
#   SQLite  : docker compose -f docker-compose.dotnet.yml up --build
#   Postgres: docker compose -f docker-compose.dotnet.yml --profile postgres up --build
#
# URLs once running:
#   App     → http://localhost
#   API     → http://localhost/api
#   Swagger → http://localhost/swagger
#   Mailpit → http://localhost:8025

services:

  # ── Nuxt Frontend (nginx) ────────────────────────────────────────────────────
  mealie-frontend:
    container_name: mealie_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      mealie-api:
        condition: service_healthy
    profiles: ["", "sqlite", "postgres"]

  # ── C# Backend (SQLite, default) ─────────────────────────────────────────────
  mealie-api:
    container_name: mealie_api
    build:
      context: ./backend-dotnet
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "9000:9000"   # also reachable directly for debugging
    volumes:
      - mealie-data:/app/data
    environment:
      DB_ENGINE: sqlite
      DATABASE_URL: "Data Source=/app/data/mealie.db"
      SECRET: "local-dev-secret-change-me-32chars!!"
      BASE_URL: "http://localhost"
      DATA_DIR: /app/data
      LOG_LEVEL: Debug
      ALLOW_SIGNUP: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH_STRATEGY: NONE
      SMTP_FROM_EMAIL: "noreply@mealie.local"
      SMTP_FROM_NAME: "Mealie (local)"
    depends_on:
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    profiles: ["", "sqlite"]

  # ── C# Backend (Postgres) ────────────────────────────────────────────────────
  mealie-api-pg:
    container_name: mealie_api_pg
    build:
      context: ./backend-dotnet
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - mealie-data:/app/data
    environment:
      DB_ENGINE: postgres
      DATABASE_URL: "Host=postgres;Port=5432;Database=mealie;Username=mealie;Password=mealie"
      SECRET: "local-dev-secret-change-me-32chars!!"
      BASE_URL: "http://localhost"
      DATA_DIR: /app/data
      LOG_LEVEL: Debug
      ALLOW_SIGNUP: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH_STRATEGY: NONE
      SMTP_FROM_EMAIL: "noreply@mealie.local"
      SMTP_FROM_NAME: "Mealie (local)"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    profiles: ["postgres"]

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    container_name: mealie_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: mealie
      POSTGRES_DB: mealie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealie -d mealie"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["postgres"]

  # ── Mailpit (email testing UI) ───────────────────────────────────────────────
  mailpit:
    container_name: mealie_mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI → http://localhost:8025
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    profiles: ["", "sqlite", "postgres"]

volumes:
  mealie-data:
    driver: local
  postgres-data:
    driver: local
