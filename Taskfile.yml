# https://taskfile.dev

version: "3"
vars:
  GREETING: Hello, World!
env:
  DEFAULT_GROUP: Home
  DEFAULT_HOUSEHOLD: Family
  PRODUCTION: false
  API_PORT: 9000
  API_DOCS: True
  TOKEN_TIME: 256 # hours
  # mailplit SMTP config
  # start dev:services to use mailpit
  SMTP_HOST: localhost
  SMTP_PORT: 1025
  SMTP_FROM_NAME: MealieDev
  SMTP_FROM_EMAIL: mealie@example.com
  SMTP_AUTH_STRATEGY: NONE
  BASE_URL: http://localhost:3000
  LANG: en-US

# loads .env file if it exists
dotenv:
  - .env
  - .dev.env
tasks:
  setup:ui:
    desc: setup frontend dependencies
    dir: frontend
    run: once
    cmds:
      - yarn install
    sources:
      - package.json
      - yarn.lock

  setup:e2e:
    desc: setup e2e test dependencies
    dir: tests/e2e
    run: once
    cmds:
      - yarn install
      - yarn playwright install --with-deps
    sources:
      - package.json
      - playwright.config.ts
      - yarn.lock

  setup:
    desc: setup all dependencies
    deps:
      - setup:ui

  setup:ui:react:
    desc: setup React migration frontend dependencies
    dir: frontend-react
    run: once
    cmds:
      - yarn install
    sources:
      - package.json
      - yarn.lock

  dev:services:
    desc: starts postgres and mailpit containers
    cmds:
      - docker compose -f docker-compose.dotnet.yml up

  dev:clean:
    desc: cleans up dev environment !! removes all data files !!
    cmds:
      - rm -r ./dev/data/recipes/
      - rm -r ./dev/data/users/
      - rm -f ./dev/data/mealie*.db
      - rm -f ./dev/data/mealie*.db-shm
      - rm -f ./dev/data/mealie*.db-wal
      - rm -f ./dev/data/mealie.log
      - rm -f ./dev/data/.secret

  ui:build:
    desc: builds the frontend in frontend/dist
    dir: frontend
    cmds:
      - yarn build
    sources:
      - "**"
      - exclude: .nuxt/**
      - exclude: .output/**
      - exclude: dist/**
      - exclude: node_modules/.cache/**

  ui:generate:
    desc: generates a static version of the frontend in frontend/dist
    dir: frontend
    deps:
      - setup:ui
    cmds:
      - yarn generate
    sources:
      - "**"
      - exclude: .nuxt/**
      - exclude: .output/**
      - exclude: dist/**
      - exclude: node_modules/.cache/**

  ui:lint:
    desc: runs the frontend linter
    dir: frontend
    cmds:
      - yarn lint --max-warnings=0
    sources:
      - "**"
      - exclude: .nuxt/**
      - exclude: .output/**
      - exclude: dist/**
      - exclude: node_modules/.cache/**

  ui:test:
    desc: runs the frontend tests
    dir: frontend
    cmds:
      - yarn test
    sources:
      - "**"
      - exclude: .nuxt/**
      - exclude: .output/**
      - exclude: dist/**
      - exclude: node_modules/.cache/**

  ui:check:
    desc: runs all frontend checks
    deps:
      - ui:lint
      - ui:test

  ui:react:build:
    desc: builds the React migration frontend in frontend-react/dist
    dir: frontend-react
    deps:
      - setup:ui:react
    cmds:
      - yarn build

  ui:react:generate:
    desc: generates a static version of the React migration frontend in frontend-react/dist
    deps:
      - ui:react:build

  ui:react:lint:
    desc: runs the React migration frontend linter
    dir: frontend-react
    deps:
      - setup:ui:react
    cmds:
      - yarn lint

  ui:react:test:
    desc: runs the React migration frontend tests
    dir: frontend-react
    deps:
      - setup:ui:react
    cmds:
      - yarn test

  ui:react:check:
    desc: runs all React migration frontend checks
    deps:
      - ui:react:lint
      - ui:react:test

  ui:
    desc: runs the frontend server
    dir: frontend
    cmds:
      - yarn run dev --no-fork

  ui:legacy:
    desc: runs the legacy Nuxt frontend server
    deps:
      - ui

  ui:react:
    desc: runs the React migration frontend server
    dir: frontend-react
    deps:
      - setup:ui:react
    cmds:
      - yarn dev --host 0.0.0.0 --port 4173

  ui:hybrid:
    desc: runs both legacy and React frontends for migration work
    deps:
      - ui
      - ui:react

  ui:release:hybrid:
    desc: runs the docker stack with the legacy gateway proxying approved React slices
    cmds:
      - MEALIE_FRONTEND_RELEASE_VARIANT=hybrid docker compose -f docker-compose.dotnet.yml up --build --detach

  ui:release:react-default:
    desc: runs the docker stack with React as the default shipped SPA while retaining explicit rollback controls
    cmds:
      - MEALIE_FRONTEND_RELEASE_VARIANT=react-default docker compose -f docker-compose.dotnet.yml up --build --detach

  ui:release:rollback:
    desc: returns the docker stack to the legacy-only gateway while keeping the React sidecar available for comparison
    cmds:
      - MEALIE_FRONTEND_RELEASE_VARIANT=legacy-only docker compose -f docker-compose.dotnet.yml up --build --detach

  dotnet:build:
    desc: builds the C# backend
    dir: backend-dotnet
    cmds:
      - dotnet build Mealie.slnx -p:AllowMissingPrunePackageData=true

  dotnet:test:
    desc: runs C# backend tests
    dir: backend-dotnet
    cmds:
      - dotnet test Mealie.slnx --no-build

  dotnet:
    desc: runs the C# backend server
    dir: backend-dotnet
    cmds:
      - dotnet run --project src/Mealie.Api/Mealie.Api.csproj

  e2e:stop-server:
    desc: Shuts down the e2e testing containers
    dir: tests/e2e/docker
    cmds:
      - docker compose down --volumes

  e2e:test:
    desc: runs the e2e tests
    dir: tests/e2e
    deps:
      - setup:e2e
    vars:
      PREVENT_REPORT_OPEN: '{{if .PREVENT_REPORT_OPEN}}PLAYWRIGHT_HTML_OPEN=never{{else}}{{end}}'
    cmds:
      - '{{.PREVENT_REPORT_OPEN}} yarn playwright test'
