server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500M;

    location = /__release-variant {
        default_type application/json;
        add_header X-Mealie-Frontend-Instance react always;
        return 200 '{"frontend":"react","variant":"${MEALIE_REACT_RELEASE_VARIANT}","auth":"${MEALIE_ROUTE_SLICE_AUTH}","publicRecipes":"${MEALIE_ROUTE_SLICE_PUBLIC_RECIPES}","groupHome":"${MEALIE_ROUTE_SLICE_GROUP_HOME}","recipeCreateImport":"${MEALIE_ROUTE_SLICE_RECIPE_CREATE_IMPORT}","recipes":"${MEALIE_ROUTE_SLICE_RECIPES}","cookbooks":"${MEALIE_ROUTE_SLICE_COOKBOOKS}","household":"${MEALIE_ROUTE_SLICE_HOUSEHOLD}","shoppingLists":"${MEALIE_ROUTE_SLICE_SHOPPING_LISTS}","userProfile":"${MEALIE_ROUTE_SLICE_USER_PROFILE}","groupData":"${MEALIE_ROUTE_SLICE_GROUP_DATA}","admin":"${MEALIE_ROUTE_SLICE_ADMIN}"}';
    }

    location ~ ^/(api|docs|healthz|swagger)(/|$) {
        proxy_pass         http://mealie-api:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500M;
    }

    location /mcp {
        proxy_pass         http://mealie-api:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        add_header X-Mealie-Frontend-Instance react always;
        add_header X-Mealie-Release-Variant ${MEALIE_REACT_RELEASE_VARIANT} always;
        add_header X-Mealie-Release-Target react always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header X-Mealie-Frontend-Instance react always;
        add_header X-Mealie-Release-Variant ${MEALIE_REACT_RELEASE_VARIANT} always;
        add_header X-Mealie-Release-Target react always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
