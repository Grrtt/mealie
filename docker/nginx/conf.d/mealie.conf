server {
    listen 80;
    server_name mealie.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mealie.example.com;

    # Cloudflare Origin Certificate (generate in Cloudflare dashboard)
    # Dashboard → SSL/TLS → Origin Server → Create Certificate
    ssl_certificate     /etc/nginx/certs/mealie.example.com/origin.pem;
    ssl_certificate_key /etc/nginx/certs/mealie.example.com/origin.key;

    # Strong SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass         http://mealie:9000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
