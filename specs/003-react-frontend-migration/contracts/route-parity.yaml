version: 1
feature: react-frontend-migration
source_of_truth:
  pages_glob: frontend/app/pages/**/*.vue
  auth_middleware:
    - frontend/app/middleware/auth-redirect.global.ts
    - frontend/app/middleware/admin-only.ts
  workflow_sources:
    - frontend/app/composables/use-auth-backend.ts
    - frontend/app/composables/use-mealie-auth.ts
    - frontend/app/composables/api/api-client.ts
    - frontend/app/pages/index.vue
    - frontend/app/pages/login.vue

special_redirects:
  - path: /
    behavior: auth-aware redirect to admin setup, default activity, default group, or login
  - path: /login?code=...|error=...
    behavior: OIDC callback handling on the login route
  - path: /r/create/url
    behavior: PWA/share-target shortcut to the current user's group recipe-import route

coexistence_controls:
  default_release_variant: react-default
  gateway_env:
    release_variant: MEALIE_FRONTEND_RELEASE_VARIANT
    route_slice_flags:
      auth: MEALIE_ROUTE_SLICE_AUTH
      public-recipes: MEALIE_ROUTE_SLICE_PUBLIC_RECIPES
      group-home: MEALIE_ROUTE_SLICE_GROUP_HOME
      recipe-create-import: MEALIE_ROUTE_SLICE_RECIPE_CREATE_IMPORT
      recipes: MEALIE_ROUTE_SLICE_RECIPES
      cookbooks: MEALIE_ROUTE_SLICE_COOKBOOKS
      household: MEALIE_ROUTE_SLICE_HOUSEHOLD
      shopping-lists: MEALIE_ROUTE_SLICE_SHOPPING_LISTS
      user-profile: MEALIE_ROUTE_SLICE_USER_PROFILE
      group-data: MEALIE_ROUTE_SLICE_GROUP_DATA
      admin: MEALIE_ROUTE_SLICE_ADMIN
  status_endpoints:
    legacy_gateway: /__release-variant
    react_sidecar: http://localhost:8080/__release-variant

route_slices:
  auth:
    promoted_phase: phase-2
    approved_paths:
      - /
      - /login
      - /register
      - /forgot-password
      - /reset-password
  public-recipes:
    promoted_phase: phase-2
    approved_paths:
      - /g/:groupSlug/shared/r/:id
  group-home:
    promoted_phase: phase-2
    approved_paths:
      - /g/:groupSlug
  recipe-create-import:
    promoted_phase: phase-2
    approved_paths:
      - /r/create/url
      - /g/:groupSlug/r/create
      - /g/:groupSlug/r/create/new
      - /g/:groupSlug/r/create/url
      - /g/:groupSlug/r/create/zip
      - /g/:groupSlug/r/create/html
      - /g/:groupSlug/r/create/image
      - /g/:groupSlug/r/create/bulk
      - /g/:groupSlug/r/create/debug
  recipes:
    promoted_phase: phase-2
    approved_paths:
      - /g/:groupSlug/r/:slug
      - /g/:groupSlug/recipes/timeline
      - /g/:groupSlug/recipes/categories
      - /g/:groupSlug/recipes/tags
      - /g/:groupSlug/recipes/tools
      - /g/:groupSlug/recipes/finder
  cookbooks:
    promoted_phase: phase-2
    approved_paths:
      - /g/:groupSlug/cookbooks
      - /g/:groupSlug/cookbooks/:slug
  household:
    promoted_phase: phase-2
    approved_paths:
      - /household
      - /household/members
      - /household/notifiers
      - /household/webhooks
      - /household/mealplan/planner
      - /household/mealplan/planner/view
      - /household/mealplan/planner/edit
      - /household/mealplan/settings
  shopping-lists:
    promoted_phase: phase-2
    approved_paths:
      - /shopping-lists
      - /shopping-lists/:id
  user-profile:
    promoted_phase: phase-3
    approved_paths:
      - /user/:id/favorites
      - /user/profile
      - /user/profile/edit
      - /user/profile/api-tokens
  group-data:
    promoted_phase: phase-3
    approved_paths:
      - /group
      - /group/data
      - /group/data/recipes
      - /group/data/categories
      - /group/data/tags
      - /group/data/tools
      - /group/data/foods
      - /group/data/units
      - /group/data/labels
      - /group/data/recipe-actions
      - /group/reports/:id
      - /group/migrations
  admin:
    promoted_phase: phase-4
    approved_paths:
      - /admin
      - /admin/setup
      - /admin/site-settings
      - /admin/backups
      - /admin/ai-configurations
      - /admin/debug/indexes
      - /admin/debug/openai
      - /admin/debug/parser
      - /admin/manage/users
      - /admin/manage/users/create
      - /admin/manage/users/:id
      - /admin/manage/groups
      - /admin/manage/groups/:id
      - /admin/manage/households
      - /admin/manage/households/:id
      - /admin/manage/ingredient-aliases
      - /admin/maintenance
surfaces:
  auth:
    owner: frontend-react
    phase_id: phase-2
    release_slice: auth
    access: mixed
    routes:
      - /
      - /login
      - /register
      - /forgot-password
      - /reset-password
    react_outcomes:
      - route: /
        outcome: native-route
      - route: /login
        outcome: native-route
      - route: /register
        outcome: native-route
      - route: /forgot-password
        outcome: native-route
      - route: /reset-password
        outcome: native-route
    must_preserve:
      - password login when enabled
      - self registration when enabled
      - password reset
      - OIDC redirect/callback behavior when enabled
      - redirect-after-login to intended destination

  public-recipes:
    access: public
    release_slice: public-recipes
    routes:
      - /g/:groupSlug/shared/r/:id
    must_preserve:
      - cold-start direct navigation
      - meaningful title/share metadata
      - no forced authentication

  group-home:
    owner: frontend-react
    phase_id: phase-2
    release_slice: group-home
    access: authenticated
    routes:
      - /g/:groupSlug
    react_outcomes:
      - route: /g/:groupSlug
        outcome: native-route
    must_preserve:
      - default post-login landing behavior
      - group-scoped navigation shell

  recipe-create-import:
    access: authenticated
    release_slice: recipe-create-import
    routes:
      - /g/:groupSlug/r/create
      - /g/:groupSlug/r/create/new
      - /g/:groupSlug/r/create/url
      - /g/:groupSlug/r/create/zip
      - /g/:groupSlug/r/create/html
      - /g/:groupSlug/r/create/image
      - /g/:groupSlug/r/create/bulk
      - /g/:groupSlug/r/create/debug
    must_preserve:
      - recipe creation
      - import entry points
      - debug/import helper paths used today

  recipes:
    access: authenticated
    release_slice: recipes
    routes:
      - /g/:groupSlug/r/:slug
      - /g/:groupSlug/recipes/timeline
      - /g/:groupSlug/recipes/categories
      - /g/:groupSlug/recipes/tags
      - /g/:groupSlug/recipes/tools
      - /g/:groupSlug/recipes/finder
    must_preserve:
      - recipe deep links
      - timeline interactions
      - category/tag/tool browsing
      - recipe finder behavior

  cookbooks:
    access: authenticated
    release_slice: cookbooks
    routes:
      - /g/:groupSlug/cookbooks
      - /g/:groupSlug/cookbooks/:slug

  group-data:
    access: authenticated
    release_slice: group-data
    routes:
      - /group
      - /group/data
      - /group/data/recipes
      - /group/data/categories
      - /group/data/tags
      - /group/data/tools
      - /group/data/foods
      - /group/data/units
      - /group/data/labels
      - /group/data/recipe-actions
      - /group/reports/:id
      - /group/migrations

  household:
    access: authenticated
    release_slice: household
    routes:
      - /household
      - /household/members
      - /household/notifiers
      - /household/webhooks
      - /household/mealplan/planner
      - /household/mealplan/planner/view
      - /household/mealplan/planner/edit
      - /household/mealplan/settings
    must_preserve:
      - meal plan editing/viewing
      - rules/settings
      - notifications/webhooks
      - member management

  shopping-lists:
    access: authenticated
    release_slice: shopping-lists
    routes:
      - /shopping-lists
      - /shopping-lists/:id
    must_preserve:
      - direct list deep links
      - list creation/update/check-off flows

  user-profile:
    access: authenticated
    release_slice: user-profile
    routes:
      - /user/:id/favorites
      - /user/profile
      - /user/profile/edit
      - /user/profile/api-tokens
    must_preserve:
      - favorites
      - profile editing
      - API token management

  admin:
    access: admin-only
    release_slice: admin
    routes:
      - /admin
      - /admin/setup
      - /admin/site-settings
      - /admin/backups
      - /admin/ai-configurations
      - /admin/debug/indexes
      - /admin/debug/openai
      - /admin/debug/parser
      - /admin/manage/users
      - /admin/manage/users/create
      - /admin/manage/users/:id
      - /admin/manage/groups
      - /admin/manage/groups/:id
      - /admin/manage/households
      - /admin/manage/households/:id
      - /admin/manage/ingredient-aliases
      - /admin/maintenance
    must_preserve:
      - admin-only guard behavior
      - first-time setup redirect
      - maintenance/backups/debug/manage tools
    react_outcomes:
      - route: /admin
        outcome: redirect
      - route: /admin/setup
        outcome: native-route
      - route: /admin/site-settings
        outcome: native-route
      - route: /admin/backups
        outcome: native-route
      - route: /admin/ai-configurations
        outcome: native-route
      - route: /admin/debug/indexes
        outcome: native-route
      - route: /admin/debug/openai
        outcome: native-route
      - route: /admin/debug/parser
        outcome: native-route
      - route: /admin/manage/users
        outcome: native-route
      - route: /admin/manage/users/create
        outcome: native-route
      - route: /admin/manage/users/:id
        outcome: native-route
      - route: /admin/manage/groups
        outcome: native-route
      - route: /admin/manage/groups/:id
        outcome: native-route
      - route: /admin/manage/households
        outcome: native-route
      - route: /admin/manage/households/:id
        outcome: native-route
      - route: /admin/manage/ingredient-aliases
        outcome: native-route
      - route: /admin/maintenance
        outcome: native-route

release_expectations:
  - every route above must end as native-route, approved redirect, or explicit retirement decision
  - public routes must remain public
  - admin routes must preserve admin-only protection
  - deep-link-critical routes require direct-navigation smoke coverage before cutover
  - auth and group-home are the first React-native slice and establish the initial migration baseline
  - hybrid rollout must be controllable through release-variant and route-slice flags without rebuilding backend data or user accounts
  - react-default remains the shipped baseline while `MEALIE_FRONTEND_RELEASE_VARIANT=legacy-only` preserves the documented rollback path
  - legacy frontend retirement stays blocked until the rollback window is explicitly closed and the `legacy-only` release variant is no longer required
