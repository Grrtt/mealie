map $uri $mealie_route_slice {
    default legacy-fallback;
    ~^/$ auth;
    ~^/(login|register|forgot-password|reset-password)/?$ auth;
    ~^/g/[^/]+/shared/r/[^/]+/?$ public-recipes;
    ~^/g/[^/]+/?$ group-home;
    ~^/r/create/url/?$ recipe-create-import;
    ~^/g/[^/]+/r/create/?$ recipe-create-import;
    ~^/g/[^/]+/r/create/(new|url|zip|html|image|bulk|debug)/?$ recipe-create-import;
    ~^/g/[^/]+/r/[^/]+/?$ recipes;
    ~^/g/[^/]+/recipes/?$ recipes;
    ~^/g/[^/]+/recipes/(timeline|finder|categories|tags|tools)/?$ recipes;
    ~^/g/[^/]+/cookbooks/?$ cookbooks;
    ~^/g/[^/]+/cookbooks/[^/]+/?$ cookbooks;
    ~^/household/?$ household;
    ~^/household/(members|notifiers|webhooks)/?$ household;
    ~^/household/mealplan/planner/?$ household;
    ~^/household/mealplan/planner/(view|edit)/?$ household;
    ~^/household/mealplan/settings/?$ household;
    ~^/shopping-lists/?$ shopping-lists;
    ~^/shopping-lists/[^/]+/?$ shopping-lists;
    ~^/user/profile/?$ user-profile;
    ~^/user/profile/edit/?$ user-profile;
    ~^/user/profile/api-tokens/?$ user-profile;
    ~^/user/[^/]+/favorites/?$ user-profile;
    ~^/group/?$ group-data;
    ~^/group/data/?$ group-data;
    ~^/group/data/(recipes|categories|tags|tools|foods|units|labels|recipe-actions)/?$ group-data;
    ~^/group/reports/[^/]+/?$ group-data;
    ~^/group/migrations/?$ group-data;
    ~^/admin/?$ admin;
    ~^/admin/setup/?$ admin;
    ~^/admin/site-settings/?$ admin;
    ~^/admin/logs/?$ admin;
    ~^/admin/backups/?$ admin;
    ~^/admin/ai-configurations/?$ admin;
    ~^/admin/debug/(indexes|openai|parser)/?$ admin;
    ~^/admin/manage/users/?$ admin;
    ~^/admin/manage/users/create/?$ admin;
    ~^/admin/manage/users/[^/]+/?$ admin;
    ~^/admin/manage/groups/?$ admin;
    ~^/admin/manage/groups/[^/]+/?$ admin;
    ~^/admin/manage/households/?$ admin;
    ~^/admin/manage/households/[^/]+/?$ admin;
    ~^/admin/manage/ingredient-aliases/?$ admin;
    ~^/admin/maintenance/?$ admin;
}

map $mealie_route_slice $mealie_route_slice_enabled {
    default false;
    auth ${MEALIE_ROUTE_SLICE_AUTH};
    public-recipes ${MEALIE_ROUTE_SLICE_PUBLIC_RECIPES};
    group-home ${MEALIE_ROUTE_SLICE_GROUP_HOME};
    recipe-create-import ${MEALIE_ROUTE_SLICE_RECIPE_CREATE_IMPORT};
    recipes ${MEALIE_ROUTE_SLICE_RECIPES};
    cookbooks ${MEALIE_ROUTE_SLICE_COOKBOOKS};
    household ${MEALIE_ROUTE_SLICE_HOUSEHOLD};
    shopping-lists ${MEALIE_ROUTE_SLICE_SHOPPING_LISTS};
    user-profile ${MEALIE_ROUTE_SLICE_USER_PROFILE};
    group-data ${MEALIE_ROUTE_SLICE_GROUP_DATA};
    admin ${MEALIE_ROUTE_SLICE_ADMIN};
}

map "${MEALIE_FRONTEND_RELEASE_VARIANT}:$mealie_route_slice:$mealie_route_slice_enabled" $mealie_route_target {
    default legacy;
    ~^hybrid:[^:]+:true$ react;
    ~^react-default:[^:]+:true$ react;
}

map "${MEALIE_FRONTEND_RELEASE_VARIANT}" $mealie_proxy_react_assets {
    default false;
    hybrid true;
    react-default true;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500M;

    # Proxy API, docs, and health requests to the C# backend
    location ~ ^/(api|docs|healthz|swagger)(/|$) {
        proxy_pass         http://mealie-api:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500M;
    }

    # MCP server — SSE streaming requires buffering disabled and long timeouts
    location /mcp {
        proxy_pass         http://mealie-api:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /__release-variant {
        default_type application/json;
        add_header X-Mealie-Frontend-Instance legacy-gateway always;
        return 200 '{"frontend":"legacy-gateway","variant":"${MEALIE_FRONTEND_RELEASE_VARIANT}","auth":"${MEALIE_ROUTE_SLICE_AUTH}","publicRecipes":"${MEALIE_ROUTE_SLICE_PUBLIC_RECIPES}","groupHome":"${MEALIE_ROUTE_SLICE_GROUP_HOME}","recipeCreateImport":"${MEALIE_ROUTE_SLICE_RECIPE_CREATE_IMPORT}","recipes":"${MEALIE_ROUTE_SLICE_RECIPES}","cookbooks":"${MEALIE_ROUTE_SLICE_COOKBOOKS}","household":"${MEALIE_ROUTE_SLICE_HOUSEHOLD}","shoppingLists":"${MEALIE_ROUTE_SLICE_SHOPPING_LISTS}","userProfile":"${MEALIE_ROUTE_SLICE_USER_PROFILE}","groupData":"${MEALIE_ROUTE_SLICE_GROUP_DATA}","admin":"${MEALIE_ROUTE_SLICE_ADMIN}"}';
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 'self.addEventListener("install",event=>event.waitUntil(self.skipWaiting()));self.addEventListener("activate",event=>event.waitUntil((async()=>{const keys=await caches.keys();await Promise.all(keys.map(key=>caches.delete(key)));await self.registration.unregister();const clients=await self.clients.matchAll({type:"window",includeUncontrolled:true});for(const client of clients){client.navigate(client.url);}})()));';
    }

    location ^~ /assets/ {
        if ($mealie_proxy_react_assets = true) {
            return 418;
        }

        add_header X-Mealie-Frontend-Instance legacy always;
        add_header X-Mealie-Release-Variant ${MEALIE_FRONTEND_RELEASE_VARIANT} always;
        add_header X-Mealie-Release-Target legacy always;
        add_header X-Mealie-Route-Slice static-assets always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — proxy approved React slices and keep legacy available for explicit rollback-only drills
    location / {
        if ($mealie_route_target = react) {
            return 418;
        }

        add_header X-Mealie-Frontend-Instance legacy always;
        add_header X-Mealie-Release-Variant ${MEALIE_FRONTEND_RELEASE_VARIANT} always;
        add_header X-Mealie-Release-Target legacy always;
        add_header X-Mealie-Route-Slice $mealie_route_slice always;
        try_files $uri $uri/ /index.html;
    }

    error_page 418 = @react_frontend;
    location @react_frontend {
        proxy_pass         http://mealie-frontend-react:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header X-Mealie-Frontend-Instance react always;
        add_header X-Mealie-Release-Variant ${MEALIE_FRONTEND_RELEASE_VARIANT} always;
        add_header X-Mealie-Release-Target react always;
        add_header X-Mealie-Route-Slice $mealie_route_slice always;
    }

    # Cache legacy static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header X-Mealie-Frontend-Instance legacy always;
        add_header X-Mealie-Release-Variant ${MEALIE_FRONTEND_RELEASE_VARIANT} always;
        add_header X-Mealie-Release-Target legacy always;
        add_header X-Mealie-Route-Slice static-assets always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
