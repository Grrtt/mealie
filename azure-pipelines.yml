trigger:
  branches:
    include:
      - mealie-next

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  IMAGE_NAME: ghcr.io/grrtt/mealie

steps:
  - task: Docker@2
    displayName: Login to GHCR
    inputs:
      command: login
      containerRegistry: mealie-docker-images  # Replace with your ADO service connection name

  - task: Docker@2
    displayName: Build Docker image
    inputs:
      command: build
      dockerfile: docker/Dockerfile
      repository: $(IMAGE_NAME)
      tags: |
        $(Build.SourceVersion)
        latest
      arguments: --build-arg COMMIT=$(Build.SourceVersion)

  - task: Docker@2
    displayName: Push to GHCR
    inputs:
      command: push
      repository: $(IMAGE_NAME)
      tags: |
        $(Build.SourceVersion)
        latest
