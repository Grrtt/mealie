trigger:
  branches:
    include:
      - mealie-next
  paths:
    include:
      - azure-pipelines.yml
      - docker-compose.yml
      - docker-compose.azure.yml
      - backend-dotnet/**
      - frontend-react/**
      - frontend-react/src/lib/api/types/**
      - frontend-react/src/lib/i18n/**

pr: none

# ─────────────────────────────────────────────────────────────────────────────
# PREREQUISITES — set these up before running this pipeline:
#
# AZURE DEVOPS:
#   1. Service Connections (Project Settings → Service Connections):
#      • Type: SSH — named "mealie-deploy"
#        Add your Linux server host, port (22), username, and private key.
#
#   2. Variables:
#      Define these either as pipeline variables or in any authorized variable
#      group linked to the pipeline. This YAML does not require a specific
#      variable group name.
#      Required variables:
#        - GH_OWNER                     : GitHub username or org that owns the repo
#        - GITHUB_USER                  : GitHub username for ghcr.io login
#        - GITHUB_TOKEN                 : GitHub PAT with read:packages + write:packages
#        - APP_MEALIE_BASE_URL          : Public base URL, e.g. https://mealie.example.com
#        - APP_MEALIE_SECRET            : Backend SECRET value
#        - APP_MEALIE_SQLSERVER_PASSWORD: SQL Server SA password for the bundled DB
#      Common optional APP_ variables for SMTP are wired in the
#      "Generate deployment .env" step below.
#
# LINUX SERVER:
#   3. Docker and Docker Compose plugin installed; deploy user in the 'docker'
#      group and $(DEPLOY_PATH)/website writable by that user.
#
# DEPLOYMENT SHAPE:
#   4. This pipeline deploys docker-compose.yml together with
#      docker-compose.azure.yml so the server serves the React frontend on
#      the published frontend port defined in docker-compose.yml (currently 9000)
#      from GHCR images.
# ─────────────────────────────────────────────────────────────────────────────

variables:
  - name: CLIENT_NAME
    value: 'mealie'
  - name: DEPLOY_PATH
    value: '/home/mealie'
  - name: apiImageName
    value: '$(CLIENT_NAME)-api'
  - name: frontendImageName
    value: '$(CLIENT_NAME)-frontend'
  - name: imageTag
    value: 'prod-$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build & Test
    jobs:
      - job: BuildJob
        displayName: Validate backend and React frontend
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - script: |
              missing=0
              for name in GH_OWNER GITHUB_USER GITHUB_TOKEN APP_MEALIE_BASE_URL APP_MEALIE_SECRET APP_MEALIE_SQLSERVER_PASSWORD; do
                if [ -z "$(printenv "$name")" ]; then
                  echo "##vso[task.logissue type=error]Missing required pipeline variable: $name"
                  missing=1
                fi
              done

              if [ "$missing" -ne 0 ]; then
                echo "##vso[task.complete result=Failed;]Required pipeline variables are missing. Define them in the pipeline or in an authorized variable group."
                exit 1
              fi
            displayName: Validate required pipeline variables
            env:
              GH_OWNER: $(GH_OWNER)
              GITHUB_USER: $(GITHUB_USER)
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              APP_MEALIE_BASE_URL: $(APP_MEALIE_BASE_URL)
              APP_MEALIE_SECRET: $(APP_MEALIE_SECRET)
              APP_MEALIE_SQLSERVER_PASSWORD: $(APP_MEALIE_SQLSERVER_PASSWORD)

          - task: UseDotNet@2
            displayName: Install .NET 10 SDK
            inputs:
              packageType: sdk
              version: '10.x'

          - task: NodeTool@0
            displayName: Install Node.js 24
            inputs:
              versionSpec: '24.x'

          - script: |
              corepack enable
              corepack prepare yarn@1.22.22 --activate
            displayName: Activate Yarn 1 with Corepack

          - script: dotnet build backend-dotnet/Mealie.slnx --configuration Release -p:AllowMissingPrunePackageData=true
            displayName: dotnet build backend-dotnet/Mealie.slnx

          - script: dotnet test backend-dotnet/Mealie.slnx --configuration Release --logger trx --no-build -p:AllowMissingPrunePackageData=true
            displayName: dotnet test backend-dotnet/Mealie.slnx

          - task: PublishTestResults@2
            displayName: Publish .NET test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: 'backend-dotnet/**/TestResults/*.trx'

          - script: |
              cd frontend-react
              yarn install --frozen-lockfile --non-interactive
              yarn lint
              yarn test
              yarn build
            displayName: Validate React migration frontend

          - publish: docker-compose.yml
            artifact: deploy-compose
            displayName: Upload docker-compose.yml

          - publish: docker-compose.azure.yml
            artifact: deploy-override
            displayName: Upload docker-compose.azure.yml

  - stage: Docker
    displayName: Docker Build & Push
    dependsOn: Build
    jobs:
      - job: DockerJob
        displayName: Build and push GHCR images
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - script: |
              echo "$(GITHUB_TOKEN)" | docker login ghcr.io -u "$(GITHUB_USER)" --password-stdin
            displayName: Login to GHCR
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: |
              IMAGE="ghcr.io/$(GH_OWNER)/$(apiImageName):$(imageTag)"
              echo "Building $IMAGE"
              docker build \
                -f backend-dotnet/docker/Dockerfile \
                -t "$IMAGE" \
                backend-dotnet
              docker push "$IMAGE"
            displayName: Build & push backend image

          - script: |
              IMAGE="ghcr.io/$(GH_OWNER)/$(frontendImageName):$(imageTag)"
              echo "Building $IMAGE"
              docker build \
                -f frontend-react/Dockerfile \
                -t "$IMAGE" \
                frontend-react
              docker push "$IMAGE"
            displayName: Build & push frontend image

  - stage: Deploy
    displayName: Deploy to Linux Server
    dependsOn: Docker
    jobs:
      - job: DeployJob
        displayName: SSH deploy
        pool:
          vmImage: ubuntu-latest
        steps:
          - download: current
            artifact: deploy-compose
            displayName: Download base compose file

          - download: current
            artifact: deploy-override
            displayName: Download Azure override compose file

          - script: |
              DB_ENGINE="${APP_MEALIE_DB_ENGINE:-sqlserver}"
              DATABASE_URL="${APP_MEALIE_DATABASE_URL:-Server=sqlserver,1433;Database=mealie;User Id=sa;Password=${APP_MEALIE_SQLSERVER_PASSWORD};TrustServerCertificate=True;Encrypt=False}"

              cat > "$(Agent.TempDirectory)/.env" <<EOF
              MEALIE_API_IMAGE=ghcr.io/$(GH_OWNER)/$(apiImageName):$(imageTag)
              MEALIE_FRONTEND_IMAGE=ghcr.io/$(GH_OWNER)/$(frontendImageName):$(imageTag)
              MEALIE_ASPNETCORE_ENVIRONMENT=Production
              MEALIE_LOG_LEVEL=Information
              MEALIE_ALLOW_SIGNUP=false
              MEALIE_DB_ENGINE=${DB_ENGINE}
              MEALIE_DATABASE_URL=${DATABASE_URL}
              MEALIE_BASE_URL=${APP_MEALIE_BASE_URL}
              MEALIE_SECRET=${APP_MEALIE_SECRET}
              MEALIE_SQLSERVER_PASSWORD=${APP_MEALIE_SQLSERVER_PASSWORD}
              MEALIE_SMTP_HOST=${APP_MEALIE_SMTP_HOST}
              MEALIE_SMTP_PORT=${APP_MEALIE_SMTP_PORT}
              MEALIE_SMTP_AUTH_STRATEGY=${APP_MEALIE_SMTP_AUTH_STRATEGY}
              MEALIE_SMTP_USER=${APP_MEALIE_SMTP_USER}
              MEALIE_SMTP_PASSWORD=${APP_MEALIE_SMTP_PASSWORD}
              MEALIE_SMTP_FROM_EMAIL=${APP_MEALIE_SMTP_FROM_EMAIL}
              MEALIE_SMTP_FROM_NAME=${APP_MEALIE_SMTP_FROM_NAME}
              EOF
            displayName: Generate deployment .env
            env:
              APP_MEALIE_BASE_URL: $(APP_MEALIE_BASE_URL)
              APP_MEALIE_DB_ENGINE: $(APP_MEALIE_DB_ENGINE)
              APP_MEALIE_DATABASE_URL: $(APP_MEALIE_DATABASE_URL)
              APP_MEALIE_SECRET: $(APP_MEALIE_SECRET)
              APP_MEALIE_SMTP_AUTH_STRATEGY: $(APP_MEALIE_SMTP_AUTH_STRATEGY)
              APP_MEALIE_SMTP_FROM_EMAIL: $(APP_MEALIE_SMTP_FROM_EMAIL)
              APP_MEALIE_SMTP_FROM_NAME: $(APP_MEALIE_SMTP_FROM_NAME)
              APP_MEALIE_SMTP_HOST: $(APP_MEALIE_SMTP_HOST)
              APP_MEALIE_SMTP_PASSWORD: $(APP_MEALIE_SMTP_PASSWORD)
              APP_MEALIE_SMTP_PORT: $(APP_MEALIE_SMTP_PORT)
              APP_MEALIE_SMTP_USER: $(APP_MEALIE_SMTP_USER)
              APP_MEALIE_SQLSERVER_PASSWORD: $(APP_MEALIE_SQLSERVER_PASSWORD)

          - task: SSH@0
            displayName: Ensure remote deploy directory exists
            inputs:
              sshEndpoint: $(CLIENT_NAME)-deploy
              runOptions: commands
              commands: mkdir -p $(DEPLOY_PATH)/website
              failOnStdErr: false

          - task: CopyFilesOverSSH@0
            displayName: Copy .env to server
            inputs:
              sshEndpoint: $(CLIENT_NAME)-deploy
              sourceFolder: $(Agent.TempDirectory)
              contents: .env
              targetFolder: $(DEPLOY_PATH)/website
              overwrite: true

          - task: CopyFilesOverSSH@0
            displayName: Copy docker-compose.yml to server
            inputs:
              sshEndpoint: $(CLIENT_NAME)-deploy
              sourceFolder: $(Pipeline.Workspace)/deploy-compose
              contents: docker-compose.yml
              targetFolder: $(DEPLOY_PATH)/website
              overwrite: true

          - task: CopyFilesOverSSH@0
            displayName: Copy docker-compose.azure.yml to server
            inputs:
              sshEndpoint: $(CLIENT_NAME)-deploy
              sourceFolder: $(Pipeline.Workspace)/deploy-override
              contents: docker-compose.azure.yml
              targetFolder: $(DEPLOY_PATH)/website
              overwrite: true

          - task: SSH@0
            displayName: Pull images and restart stack
            inputs:
              sshEndpoint: $(CLIENT_NAME)-deploy
              runOptions: commands
              commands: |
                echo "$(GITHUB_TOKEN)" | docker login ghcr.io -u "$(GITHUB_USER)" --password-stdin
                cd $(DEPLOY_PATH)/website
                docker compose --env-file .env -f docker-compose.yml -f docker-compose.azure.yml pull mealie-api mealie-frontend
                docker compose --env-file .env -f docker-compose.yml -f docker-compose.azure.yml up -d --remove-orphans
                docker image prune -f
              failOnStdErr: false
