trigger:
  branches:
    include:
      - mealie-next
  paths:
    include:
      - azure-pipelines.yml
      - backend-dotnet/**
      - frontend-react/**
      - frontend-react/src/lib/api/types/**
      - frontend-react/src/lib/i18n/**

pr: none

# ─────────────────────────────────────────────────────────────────────────────
# PREREQUISITES — set these up before running this pipeline:
#
# AZURE DEVOPS:
#   1. Service Connections (Project Settings → Service Connections):
#      • Docker registry named "mealie-docker-images" authorized for this
#        pipeline and pointed at ghcr.io
#
#   2. Variables:
#      Define these either as pipeline variables or in any authorized variable
#      group linked to the pipeline. This YAML does not require a specific
#      variable group name.
#      Required variables:
#        - GH_OWNER                     : GitHub username or org that owns the repo
#      The Docker service connection handles GHCR authentication for the
#      pipeline agent.
#
# IMAGE OUTPUT:
#   3. This pipeline validates the repo, then pushes both backend and frontend
#      images to GHCR with two tags:
#        - prod-$(Build.BuildId)
#        - latest
# ─────────────────────────────────────────────────────────────────────────────

variables:
  - name: CLIENT_NAME
    value: 'mealie'
  - name: apiImageName
    value: '$(CLIENT_NAME)-api'
  - name: frontendImageName
    value: '$(CLIENT_NAME)-frontend'
  - name: imageTag
    value: 'prod-$(Build.BuildId)'

stages:
  - stage: Build
    displayName: Build & Test
    jobs:
      - job: BuildJob
        displayName: Validate backend and React frontend
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - script: |
              missing=0
              for name in GH_OWNER; do
                if [ -z "$(printenv "$name")" ]; then
                  echo "##vso[task.logissue type=error]Missing required pipeline variable: $name"
                  missing=1
                fi
              done

              if [ "$missing" -ne 0 ]; then
                echo "##vso[task.complete result=Failed;]Required pipeline variables are missing. Define them in the pipeline or in an authorized variable group."
                exit 1
              fi
            displayName: Validate required pipeline variables
            env:
              GH_OWNER: $(GH_OWNER)

          - task: UseDotNet@2
            displayName: Install .NET 10 SDK
            inputs:
              packageType: sdk
              version: '10.x'

          - task: NodeTool@0
            displayName: Install Node.js 24
            inputs:
              versionSpec: '24.x'

          - script: |
              corepack enable
              corepack prepare yarn@1.22.22 --activate
            displayName: Activate Yarn 1 with Corepack

          - script: dotnet build backend-dotnet/Mealie.slnx --configuration Release -p:AllowMissingPrunePackageData=true
            displayName: dotnet build backend-dotnet/Mealie.slnx

          - script: dotnet test backend-dotnet/Mealie.slnx --configuration Release --logger trx --no-build -p:AllowMissingPrunePackageData=true
            displayName: dotnet test backend-dotnet/Mealie.slnx

          - task: PublishTestResults@2
            displayName: Publish .NET test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: 'backend-dotnet/**/TestResults/*.trx'

          - script: |
              cd frontend-react
              yarn install --frozen-lockfile --non-interactive
              yarn lint
              yarn test
              yarn build
            displayName: Validate React migration frontend

  - stage: Docker
    displayName: Docker Build & Push
    dependsOn: Build
    jobs:
      - job: DockerJob
        displayName: Build and push GHCR images
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: Docker@2
            displayName: Login to GHCR
            inputs:
              command: login
              containerRegistry: mealie-docker-images

          - task: Docker@2
            displayName: Build backend image
            inputs:
              command: build
              containerRegistry: mealie-docker-images
              repository: $(GH_OWNER)/$(apiImageName)
              dockerfile: backend-dotnet/docker/Dockerfile
              buildContext: backend-dotnet
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Push backend image
            inputs:
              command: push
              containerRegistry: mealie-docker-images
              repository: $(GH_OWNER)/$(apiImageName)
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Build frontend image
            inputs:
              command: build
              containerRegistry: mealie-docker-images
              repository: $(GH_OWNER)/$(frontendImageName)
              dockerfile: frontend-react/Dockerfile
              buildContext: frontend-react
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: Push frontend image
            inputs:
              command: push
              containerRegistry: mealie-docker-images
              repository: $(GH_OWNER)/$(frontendImageName)
              tags: |
                $(imageTag)
                latest
