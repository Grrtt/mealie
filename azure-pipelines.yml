trigger:
  branches:
    include:
      - mealie-next

pr: none

# ─── C# Backend CI ─────────────────────────────────────────────────────────
stages:
  - stage: CSharpBuild
    displayName: 'C# Backend Build & Test'
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: BuildAndTest
        displayName: 'dotnet build + dotnet test'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: sdk
              version: '10.x'

          - script: dotnet build backend-dotnet/Mealie.slnx --configuration Release -p:AllowMissingPrunePackageData=true
            displayName: 'dotnet build backend-dotnet/Mealie.slnx'

          - script: dotnet test backend-dotnet/Mealie.slnx --configuration Release --logger trx --no-build -p:AllowMissingPrunePackageData=true
            displayName: 'dotnet test backend-dotnet/Mealie.slnx'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: 'backend-dotnet/**/TestResults/*.trx'

          - script: |
              echo "OpenAPI compatibility check — backends must both be running for live comparison."
              echo "Running schema validation script in offline mode (no running backends in CI)."
              bash backend-dotnet/scripts/validate-openapi-compat.sh || true
            displayName: 'OpenAPI Compatibility Check (offline mode)'
            condition: succeededOrFailed()
# ───────────────────────────────────────────────────────────────────────────
