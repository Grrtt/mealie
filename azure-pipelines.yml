 trigger:
   branches:
     include:
       - main
 
 pool:
   vmImage: ubuntu-latest
 
 variables:
   IMAGE_NAME: mealie
   REGISTRY: your-registry.azurecr.io  # or Docker Hub, GHCR, etc.
 
 steps:
   - task: Docker@2
     displayName: Build Docker image
     inputs:
       command: build
       dockerfile: docker/Dockerfile
       tags: $(Build.BuildId)
       arguments: --build-arg COMMIT=$(Build.SourceVersion)
 
   - task: Docker@2
     displayName: Push to registry
     inputs:
       command: push
       containerRegistry: your-service-connection  # set up in Project Settings
       repository: $(IMAGE_NAME)
       tags: $(Build.BuildId)