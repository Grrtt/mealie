trigger:
  branches:
    include:
      - mealie-next

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  IMAGE_NAME: grrtt/mealie

steps:
  - task: Docker@2
    displayName: Build Docker image
    inputs:
      command: build
      containerRegistry: mealie-docker-images
      dockerfile: docker/Dockerfile
      buildContext: .
      repository: $(IMAGE_NAME)
      tags: |
        $(Build.SourceVersion)
        latest
      arguments: --build-arg COMMIT=$(Build.SourceVersion)

  - task: Docker@2
    displayName: Push to GHCR
    inputs:
      command: push
      containerRegistry: mealie-docker-images
      repository: $(IMAGE_NAME)
      tags: |
        $(Build.SourceVersion)
        latest
